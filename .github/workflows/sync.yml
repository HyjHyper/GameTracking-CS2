name: CS2 GameTracking Monitor

# 配置触发条件
on:
  schedule:
    # 采用 Linux Cron 表达式。由于 GitHub 限制，免费账户最低间隔通常为 5 分钟test
    # */5 * * * * 表示每隔 5 分钟自动执行一次全流程检查
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上随时手动点击按钮测试运行

jobs:
  check-and-sync:
    runs-on: ubuntu-latest

    steps:
    # Step 1: 拉取你当前 Fork 仓库的代码
    - name: Checkout local fork
      uses: actions/checkout@v4
      with:
        ref: master        # 明确指定只拉 master 分支
        fetch-depth: 1 

    # Step 2: 配置 Git 机器人身份（用于在发现更新时提交同步）
    - name: Configure Git
      run: |
        git config --global user.name "CS2-Monitor-Bot"
        git config --global user.email "bot@github.com"

    # Step 3: 添加官方上游源（Upstream）并拉取对比
    - name: Fetch upstream changes
      run: |
        git remote add upstream https://github.com/SteamDatabase/GameTracking-CS2.git
        git fetch upstream master --depth=1

    # Step 4: 检查官方仓库是否有新提交，并允许合并无关历史
    - name: Check for new commits and dispatch
      id: check_commits
      run: |
        LOCAL_SHA=$(git rev-parse HEAD)
        UPSTREAM_SHA=$(git rev-parse upstream/master)
        
        echo "本地最新提交 SHA: $LOCAL_SHA"
        echo "官方最新提交 SHA: $UPSTREAM_SHA"
        
        if [ "$LOCAL_SHA" != "$UPSTREAM_SHA" ]; then
          echo "检测到 V 社后台更新！正在同步仓库..."
          
          # 核心修复：添加 --allow-unrelated-histories 参数，允许 Git 强行咬合
          # 同时使用 -X theirs 参数，告诉 Git 冲突时一律以官方 upstream 的文件为准
          git merge upstream/master --allow-unrelated-histories -X theirs --no-edit
          
          # 将对齐后的最新代码推回你的 Fork 仓库
          git push origin master
          
          COMMIT_MSG=$(git log -1 --pretty=%B upstream/master | head -n 1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an upstream/master)
          COMMIT_URL="https://github.com/SteamDatabase/GameTracking-CS2/commit/$UPSTREAM_SHA"
          
          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_url=$COMMIT_URL" >> $GITHUB_OUTPUT
        else
          echo "暂无更新。"
          echo "has_updates=false" >> $GITHUB_OUTPUT
        fi

   # Step 5: 采用 Python 原生组件安全发送 Webhook（彻底解决 400 格式错误）
    - name: Send Webhook to Your Server
      if: steps.check_commits.outputs.has_updates == 'true'
      env:
        COMMIT_MSG: ${{ steps.check_commits.outputs.commit_msg }}
        COMMIT_AUTHOR: ${{ steps.check_commits.outputs.commit_author }}
        COMMIT_URL: ${{ steps.check_commits.outputs.commit_url }}
      run: |
        python - <<EOF
        import requests
        import json
        import os

        server_url = "http://20.207.95.79:5724/github-webhook" # 替换为你的真实公网URL

        # 原生字典构造，天然免疫任何特殊字符与缩进污染
        payload = {
            "repository": { "full_name": "SteamDatabase/GameTracking-CS2" },
            "ref": "refs/heads/master",
            "commits": [
                {
                    "message": os.environ.get('COMMIT_MSG', ''),
                    "author": { "name": os.environ.get('COMMIT_AUTHOR', '') },
                    "url": os.environ.get('COMMIT_URL', '')
                }
            ]
        }

        try:
            response = requests.post(server_url, json=payload, timeout=10)
            print(f"服务器返回状态码: {response.status_code}")
            print(f"服务器返回内容: {response.text}")
        except Exception as e:
            print(f"投递发生异常: {e}")
        EOF
